<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 字体（按需，系统字体时省略；只能用 Google 字体，CSS 地址前缀：https://lf-code-agent.coze.cn/obj/x-ai-cn/fonts/google） -->
  <!-- <link href="https://lf-code-agent.coze.cn/obj/x-ai-cn/fonts/google/google-all-fonts.css" rel="stylesheet"/> -->

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色（企业风：navy 主色 + orange 强调） === */
      --color-primary:              #1A2A4A;
      --color-primary-container:    #E8EDF6;
      --color-on-primary:           #ffffff;
      --color-accent:               #F48120;
      --color-accent-container:     #FEEFDF;
      --color-on-accent:            #ffffff;
      /* === 背景 / 表面 === */
      --color-background:                 #F6F8FB;
      --color-surface-container-lowest:   #FFFFFF;
      --color-surface:                    #FFFFFF;
      --color-surface-container:          #EEF1F6;
      --color-surface-container-high:     #E6EAF2;
      --color-surface-container-highest:  #DBE1EC;
      /* === 文字 === */
      --color-on-surface:           #152033;
      --color-on-surface-variant:   #637089;
      /* === 功能色（业务状态：阻断=红 风险=橙 关注=蓝 正常=绿） === */
      --color-success:  #16A37B;
      --color-error:    #DC2626;
      --color-warning:  #F59E0B;
      --color-info:     #3B82F6;
      /* === 边框 === */
      --color-outline:          #CBD3E1;
      --color-outline-variant:  #E6EAF2;
      /* === 圆角 === */
      --radius-sm:   0.25rem;
      --radius-md:   0.375rem;
      --radius-lg:   0.5rem;
      --radius-xl:   0.75rem;
      --radius-2xl:  1rem;
      --radius-full: 9999px;
      /* === 阴影（background ≈ surface，opacity ≥ 0.08） === */
      --shadow-card:   0 1px 3px rgba(21,32,51,0.08), 0 1px 2px rgba(21,32,51,0.04);
      --shadow-float:  0 10px 25px rgba(21,32,51,0.10);
      --shadow-dialog: 0 25px 50px rgba(21,32,51,0.18);
      /* === 字体 === */
      --font-sans: "Inter", "Noto Sans SC", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans">

  <!-- @nav:start 导航组件，不需要的页面则不要复制此段（从 @nav:start 到 @nav:end）。注意：本段包含 <div class="flex"> 容器的开标签与 <aside>，对应的 </div> 闭标签位于 </main> 之后，保留导航时必须一并保留 -->
  <header class="bg-surface sticky top-0 z-40 h-16 flex items-center justify-between px-6 border-b border-outline-variant/30">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center">
        <i data-lucide="car-front" class="w-4.5 h-4.5 text-on-primary"></i>
      </div>
      <span class="font-bold text-base text-on-surface">ExportDrive</span>
      <span class="w-px h-5 bg-outline-variant"></span>
      <span class="text-sm text-on-surface-variant font-medium">车辆生命周期管理</span>
    </div>
    <div class="flex items-center gap-3">
      <button class="w-9 h-9 rounded-lg flex items-center justify-center text-on-surface-variant hover:bg-surface-container transition-colors">
        <i data-lucide="bell" class="w-4.5 h-4.5"></i>
      </button>
      <div class="flex items-center gap-2 pl-3 border-l border-outline-variant/30">
        <div class="w-8 h-8 rounded-full bg-primary-container text-primary flex items-center justify-center text-sm font-semibold">初</div>
        <span class="text-sm font-medium text-on-surface">小初</span>
      </div>
    </div>
  </header>

  <div class="flex" style="height: calc(100vh - 4rem)">
    <aside class="w-60 shrink-0 bg-surface border-r border-outline-variant/30 overflow-y-auto">
      <div class="p-3 space-y-0.5">
        <div class="px-3 pt-2 pb-1.5 text-xs font-semibold text-on-surface-variant/70 tracking-wide">车辆生命周期</div>
        <a href="vehicle-lifecycle.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md bg-primary/10 text-primary font-medium text-sm" aria-current="page">
          <i data-lucide="route" class="w-4 h-4"></i>车辆总览
        </a>
        <a href="vehicle-lifecycle-new.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm transition-colors">
          <i data-lucide="file-plus" class="w-4 h-4"></i>新建建档
        </a>
        <a href="vehicle-lifecycle-settings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm transition-colors">
          <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>阶段字段设置
        </a>
      </div>
    </aside>
    <!-- @nav:end 导航组件结束。保留导航的页面必须保留下方 </main> 之后的 </div> 闭标签 -->

    <!-- @main-content:start -->
    <main class="flex-1 min-w-0 overflow-y-auto bg-background p-6">
      <!-- 页面内容 -->
    </main>
    <!-- @main-content:end -->
  </div>

  <script>lucide.createIcons();</script>
</body>

</html>
